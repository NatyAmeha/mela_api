apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscription-service
  template:
    metadata:
      labels:
        app: subscription-service
    spec:
      containers:
        - name: subscription-service
          image: iimela/mela-subscription-service # Pre-built Docker Hub image
          # imagePullPolicy: Never
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: "development"
          ports:
            - containerPort: 3001
          # volumeMounts:
          #   - name: node-modules
          #     mountPath: /usr/src/app/node_modules
          #   - name: app-source
          #     mountPath: /usr/src/app
          envFrom:
            - configMapRef:
                name: my-app-config
          resources: # Add resource requests and limits here
            requests:
              memory: "128Mi" # Minimum memory the container needs
              cpu: "100m" # Minimum CPU the container needs
            limits:
              memory: "256Mi" # Maximum memory the container can use
              cpu: "500m"
      # volumes:
      #   - name: app-source
      #     hostPath:
      #       path: ./apps/subscription
      #   - name: node-modules
      #     emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: subscription-service
spec:
  selector:
    app: subscription-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP
