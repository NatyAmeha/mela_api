apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          envFrom:
            - configMapRef:
                name: my-app-config
          ports:
            - containerPort: 5672
            - containerPort: 15672
          # volumeMounts:
          #   - name: rabbitmq-data
          #     mountPath: /var/lib/rabbitmq
          #   - name: rabbitmq-log
          #     mountPath: /var/log/rabbitmq
          resources: # Add resource requests and limits here
            requests:
              memory: "128Mi" # Minimum memory the container needs
              cpu: "100m" # Minimum CPU the container needs
            limits:
              memory: "256Mi" # Maximum memory the container can use
              cpu: "500m"
      # volumes:
      #   - name: rabbitmq-data
      #     hostPath:
      #       path: /usr/src/apps/rabbitmq
      #   - name: rabbitmq-log
      #     hostPath:
      #       path: /usr/src/apps/rabbitmq/log

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: rabbitmq-port
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: rabbitmq-management-port
      protocol: TCP
      port: 15672
      targetPort: 15672
  type: ClusterIP
