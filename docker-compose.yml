version: '3.4'
services:
  auth-service:
    image: iimela/mela-auth-service
    build:
     context: .
     dockerfile: ./apps/auth/Dockerfile
    environment:
      NODE_ENV: development
    env_file:
      - .env
    depends_on:
      - rabbitmq
    ports:
      - 3002:3002
    container_name: auth-service
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev auth
    networks:
      - api_network
  subscription-service:
    image: iimela/mela-subscription-service
    build:
     context: .
     dockerfile: ./apps/subscription/Dockerfile
    environment:
      NODE_ENV: development
    env_file:
      - .env
    depends_on:
      - rabbitmq
    ports:
      - 3001:3001
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    container_name: subscription-service
    command: npm run start:dev subscription   
    networks:
      - api_network
  core-service:
    image: iimela/mela-core-service
    build:
     context: .
     dockerfile: ./apps/core/Dockerfile
    environment:
      NODE_ENV: development
    env_file:
      - .env
    depends_on:
      - rabbitmq
    ports:
      - 3003:3003
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    container_name: core-service
    command: npm run start:dev core   
    networks:
      - api_network
  order-service:
    image: iimela/mela-order-service
    build:
     context: .
     dockerfile: ./apps/order_service/Dockerfile
    environment:
      NODE_ENV: development
    env_file:
      - .env
    depends_on:
      - rabbitmq
    ports:
      - 3004:3004
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    container_name: order-service
    command: npm run start:dev order_service   
    networks:
      - api_network
  api_gateway:
    image: iimela/mela-api-gateway
    build:
     context: .
     dockerfile: ./apps/mela_api/Dockerfile
    environment:
      NODE_ENV: development
    env_file:
      - .env
    depends_on:
      - auth-service
      - subscription-service
      - core-service
      - order-service
      - rabbitmq
    ports:
      - 3000:3000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    container_name: Api-gateway
    command: npm run start:dev mela_api
    networks:
      - api_network
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: 'rabbitmq'
    ports:
        - 5672:5672
        - 15672:15672
    volumes:
        - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
        - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
        - api_network
networks:
  api_network:
    driver: bridge


